spring.application.name=clinic
server.port=8080

# Optional local file with secrets (NOT committed). See .env for the variable names.
spring.config.import=optional:file:./.env[.properties]

# --- MySQL (values come from environment variables / .env; defaults are for local development only) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webdev2_clinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The SQL scripts in db/ (same files as infoman1/week13) OWN the schema, constraints, seed data and views.
# Hibernate only checks that the entities match the tables ('validate'); it never creates or alters anything.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- CORS: comma-separated list of browser origins allowed to call /api/** ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
