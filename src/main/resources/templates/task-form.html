<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
</head>
<body>
<h1>Create Task</h1>

<form th:action="@{/tasks}" th:object="${task}" method="post" action="/tasks">
    <label for="title">Title</label>
    <input type="text" id="title" th:field="*{title}">
    <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</p>

    <label for="description">Description (optional)</label>
    <textarea id="description" rows="4" th:field="*{description}"></textarea>
    <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</p>

    <label><input type="checkbox" th:field="*{completed}"> Completed</label>

    <p>
        <button type="submit" class="btn">Save</button>
        <a th:href="@{/tasks}" href="task-list.html">Cancel</a>
    </p>
</form>
</body>
</html>
