<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Recipe Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #fdfaf6; color: #3a2e28; }
        h1 { color: #8b5e3c; }
        form { max-width: 480px; background: #fff; padding: 24px; border-radius: 6px; border: 1px solid #e0d5c8; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
            border: 1px solid #cbb8a5; border-radius: 4px; }
        .error { color: #b23a2f; font-size: 13px; margin-top: 4px; }
        .actions { margin-top: 20px; }
        button, a.cancel {
            padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; cursor: pointer;
        }
        button { background: #8b5e3c; color: #fff; border: none; }
        a.cancel { background: #eee; color: #3a2e28; margin-left: 8px; }
    </style>
</head>
<body>
<h1 th:text="${formTitle}">Recipe Form</h1>

<form th:action="${formAction}" th:object="${recipe}" method="post">

    <label for="name">Recipe Name</label>
    <input type="text" id="name" th:field="*{name}" />
    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>

    <label for="category">Category</label>
    <input type="text" id="category" th:field="*{category}" placeholder="e.g., Bread, Cake, Cookie" />
    <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category error</div>

    <label for="prepTimeMinutes">Prep Time (minutes)</label>
    <input type="number" id="prepTimeMinutes" th:field="*{prepTimeMinutes}" />
    <div class="error" th:if="${#fields.hasErrors('prepTimeMinutes')}" th:errors="*{prepTimeMinutes}">Prep time error</div>

    <label for="servings">Servings</label>
    <input type="number" id="servings" th:field="*{servings}" />
    <div class="error" th:if="${#fields.hasErrors('servings')}" th:errors="*{servings}">Servings error</div>

    <label for="description">Description</label>
    <textarea id="description" th:field="*{description}" rows="4"></textarea>
    <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>

    <div class="actions">
        <button type="submit">Save Recipe</button>
        <a class="cancel" th:href="@{/recipes}">Cancel</a>
    </div>
</form>
</body>
</html>
